<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>jquery04</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(function () {
            $.getJSON('json/house.json', function (data) {
                var resultText = '';
                for (var i = 0; i < data.length; i++) {
                    resultText += data[i].houseid + ' ' + data[i].housename + '<br/>';
                }
                $('#result').html(resultText);
            });
        });
    </script>
</head>

<body>
    jquery04
    <div id="result"></div>
</body>

</html>
