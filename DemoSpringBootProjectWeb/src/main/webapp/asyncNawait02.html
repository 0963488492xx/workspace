<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>asyncNawait02</title>
    <script>
        window.onload = function () {
            async function play() {
                var promise = new Promise(function (resolve, reject) {
                    resolve('hava a nice day !!');
                });
                document.getElementById('result').innerHTML = await promise;
            }
            play();
        };

    </script>
</head>

<body>
    asyncNawait02
    <div id="result"></div>
</body>

</html>
