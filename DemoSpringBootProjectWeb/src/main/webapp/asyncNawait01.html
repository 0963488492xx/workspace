<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>asyncNawait01</title>
    <script>
        window.onload = function () {
            async function play() {
                return "play for fun";
            }

            play().then(function (msg) {
                document.getElementById('result').innerHTML = msg;
            });

        }



    </script>
</head>

<body>
    asyncNawait01
    <div id="result"></div>
</body>

</html>
