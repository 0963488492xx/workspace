<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>jqueryui</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>
    <script>
        $(function () {
            var programs = ["Java", "JavaScript", "Spring", "SpringMvc", "SpringBoot", "Hibernate", "Html", "Python", "C", "C++", "Asp.Net", "Php", "SQL Server", "MySQL", "Oracle"];

            $('#prgs').autocomplete({
                source: programs
            });
        });
    </script>
</head>

<body>
    <div class="ui-widget">
        <label for="prgs">Programs:</label>
        <input type="text" id="prgs">
    </div>
</body>

</html>
