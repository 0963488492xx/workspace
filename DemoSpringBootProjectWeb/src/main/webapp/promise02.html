<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>promise02</title>
    <script>
        window.onload = function () {
            var promise = new Promise(function (resolve, reject) {
                setTimeout(function () {
                    resolve('Nice to meet you !!');
                }, 3000);
            });

            promise.then(function (msg) {
                document.getElementById('result').innerHTML = msg;
            });
        };
    </script>
</head>

<body>
    <div id="result"></div>
</body>

</html>
